name: Publish contractor hold categories

on:
  push:
    paths:
      - '.github/workflows/tbrn-contractor-hold-statuses.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 'codex/contractor-hold-statuses-20261006:refs/remotes/origin/codex/contractor-hold-statuses-20261006'
          git show 'origin/codex/contractor-hold-statuses-20261006:.codex/contractor-hold-statuses.patch.gz.b64' | base64 --decode | gzip --decompress > /tmp/contractor-hold-statuses.patch
          echo 'a4d640274f9b2fc50066823091c7214424de8d1e89f6a4f63d04e20ad7a05b8b  /tmp/contractor-hold-statuses.patch' | sha256sum --check
          git apply --check /tmp/contractor-hold-statuses.patch
          git apply /tmp/contractor-hold-statuses.patch
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('index.html','utf8');
          const required=[
            'On hold (limited services)',
            'On hold (INS &amp; LBG)',
            'Available with limited services',
            'Available for TP claims only',
            "selected.length===1&&selected[0]==='tp'"
          ];
          for(const text of required){
            if(!source.includes(text))throw new Error('Missing deployed feature: '+text);
          }
          const pattern=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let match,count=0;
          while((match=pattern.exec(source))){
            if(/\bsrc\s*=/.test(match[1])||/type=["'](?:application\/json|importmap)/i.test(match[1]))continue;
            new vm.Script(match[2],{filename:'embedded-'+(++count)+'.js'});
          }
          console.log('Validated '+count+' embedded scripts.');
          NODE
          rm '.github/workflows/tbrn-contractor-hold-statuses.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/tbrn-contractor-hold-statuses.yml'
          git commit -m 'Publish contractor hold categories'
          git push origin HEAD:main
          git push origin --delete 'codex/contractor-hold-statuses-20261006' || true
