name: Apply admin persistence repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-admin-persistence-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply persistence fix
        shell: bash
        env:
          FIX_B64: 
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'id="tbrn-admin-persistence-fix"'
          if marker not in html:
              fix = base64.b64decode(__import__('os').environ['FIX_B64']).decode('utf-8')
              closing = '</body></html>'
              if closing not in html:
                  raise SystemExit('Closing body marker not found')
              html = html.replace(closing, fix + '\n' + closing, 1)
              path.write_text(html, encoding='utf-8')
          PY
      - name: Validate repaired file
        run: |
          grep -q 'id="tbrn-admin-persistence-fix"' index.html
          git diff --check
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/apply-admin-persistence-fix.yml
          git config user.name 'TBRN Live Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/apply-admin-persistence-fix.yml
          git commit -m 'Fix admin edit persistence'
          git push origin main
