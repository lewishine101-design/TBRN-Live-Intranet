name: Keep contractor log open
on:
  push:
    paths:
      - .github/workflows/keep-contractor-log-open.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply change-log view guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          anchor = "  window.openContractorChangeLog=function(){\n"
          if "let contractorChangeLogOpen=false;" not in text:
              if anchor not in text:
                  raise SystemExit("Open-log anchor not found")
              text = text.replace(anchor, "  let contractorChangeLogOpen=false;\n" + anchor, 1)
          old = "    const content=document.getElementById('adminContent');if(!content)return;\n    content.innerHTML="
          new = "    const content=document.getElementById('adminContent');if(!content)return;\n    contractorChangeLogOpen=true;\n    content.innerHTML="
          if "contractorChangeLogOpen=true;" not in text:
              if old not in text:
                  raise SystemExit("Open-log content anchor not found")
              text = text.replace(old,new,1)
          old_back = "    document.getElementById('contractorLogBack').onclick=()=>renderAdminDashboard();"
          new_back = "    document.getElementById('contractorLogBack').onclick=()=>{contractorChangeLogOpen=false;renderAdminDashboard()};"
          if old_back in text:
              text = text.replace(old_back,new_back,1)
          render_anchor = "  window.renderAdminDashboard=function(){\n    const result=originalRenderAdminDashboard.apply(this,arguments);"
          render_new = "  window.renderAdminDashboard=function(){\n    if(contractorChangeLogOpen&&document.getElementById('contractorChangeLogMount'))return;\n    const result=originalRenderAdminDashboard.apply(this,arguments);"
          if "contractorChangeLogOpen&&document.getElementById('contractorChangeLogMount')" not in text:
              if render_anchor not in text:
                  raise SystemExit("Admin render anchor not found")
              text = text.replace(render_anchor,render_new,1)
          path.write_text(text,encoding="utf-8")
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/keep-contractor-log-open.yml
          git add index.html
          git commit -m "Keep contractor change log open"
          git push origin main
