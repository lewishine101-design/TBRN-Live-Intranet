name: Fix Enrique desktop breakpoint
on:
  push:
    paths:
      - '.github/workflows/fix-enrique-breakpoint.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop iframe mobile rules overriding desktop panel
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch_enrique_breakpoint.py
          python3 /tmp/patch_enrique_breakpoint.py
          grep -q '@media(max-width:420px){.test-shell' index.html
          grep -q '@media(max-width:420px){.assistant' index.html
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-enrique-breakpoint.yml
          git commit -m "Fix Enrique compact desktop layout"
          git push
