name: Publish Halloween hide and seek ghosts

on:
  push:
    paths:
      - ".github/workflows/publish-halloween-hide-seek.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live Hub
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Activate the two-ghost sequence
        shell: bash
        run: |
          perl -0pi -e 's/hub-halloween\.css\?v=3/hub-halloween.css?v=4/g; s/hub-halloween\.js\?v=3/hub-halloween.js?v=4/g' index.html
          grep -q 'hub-halloween.css?v=4' index.html
          grep -q 'hub-halloween.js?v=4' index.html

      - name: Publish the Halloween hide-and-seek ghosts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate Halloween hide-and-seek ghosts"
          git push origin main

      - name: Remove the temporary publishing workflow
        shell: bash
        run: |
          git rm .github/workflows/publish-halloween-hide-seek.yml
          git commit -m "Remove Halloween hide-and-seek workflow"
          git push origin main
