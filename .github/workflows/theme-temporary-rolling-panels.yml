name: Theme temporary rolling panels
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/theme-temporary-rolling-panels.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add approved temporary panel themes
        shell: bash
        env:
          STYLE_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          style_marker = 'id="tbrn-temporary-rolling-panel-themes"'
          bootstrap_marker = '<script id="tbrn-temporary-rolling-panels-bootstrap">'
          old = "    slide.className='rolling-hero-slide temporary-rolling-slide';"
          new = """    const type=['birthday','anniversary','announcement'].includes(panel.type)?panel.type:'announcement';
              slide.className='rolling-hero-slide temporary-rolling-slide temporary-theme-'+type;
              slide.dataset.temporaryPanelType=type;"""

          if style_marker in text:
              raise SystemExit("Temporary panel themes already exist")
          if text.count(bootstrap_marker) != 1:
              raise SystemExit("Expected one temporary panel bootstrap marker")
          if text.count(old) != 1:
              raise SystemExit("Expected one temporary slide class assignment")

          styles = base64.b64decode(os.environ["STYLE_B64"]).decode("utf-8")
          text = text.replace(bootstrap_marker, styles + bootstrap_marker, 1)
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm -f '.github/workflows/theme-temporary-rolling-panels.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/theme-temporary-rolling-panels.yml'
          git commit -m 'Theme temporary rolling panels'
          git push origin main
