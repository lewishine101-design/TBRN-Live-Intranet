name: Apply duplicate repair safeguard
on:
  push:
    paths:
      - .github/workflows/apply-duplicate-repair-safeguard.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and validate safeguard
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/safeguard.patch
          git apply --check /tmp/safeguard.patch
          git apply /tmp/safeguard.patch
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('index.html','utf8');
          [...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()).forEach((s,i)=>new vm.Script(s,{filename:'inline-'+(i+1)+'.js'}));
          NODE
          git diff --check
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-duplicate-repair-safeguard.yml
          git add index.html
          git commit -m "Make duplicate identity repair race-safe"
          git push origin main
