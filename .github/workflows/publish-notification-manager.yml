name: Publish notification manager

on:
  push:
    paths:
      - '.github/workflows/publish-notification-manager.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Activate manager and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "hub-notifications.js?v=5": "hub-notifications.js?v=6",
              "hub-notifications.css?v=2": "hub-notifications.css?v=3",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"Missing asset reference: {old}")
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/publish-notification-manager.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate Admin Notification Manager"
          git push
