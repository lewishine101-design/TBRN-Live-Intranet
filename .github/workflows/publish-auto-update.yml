name: Publish automatic update checker
on:
  push:
    paths:
      - .github/workflows/publish-auto-update.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add automatic update checker
        env:
          TBRN_UPDATE_SCRIPT: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = 'id="tbrn-published-version-update-check"'
          if marker not in html:
              script = base64.b64decode(os.environ["TBRN_UPDATE_SCRIPT"]).decode("utf-8")
              if "</body>" not in html:
                  raise SystemExit("Closing body tag not found")
              html = html.replace("</body>", script + "\n\n</body>", 1)
              path.write_text(html, encoding="utf-8")
          PY
      - name: Commit live update
        run: |
          git config user.name "TBRN Hub Publisher"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/publish-auto-update.yml
          git add index.html
          git commit -m "Add automatic published-version refresh"
          git push origin main
