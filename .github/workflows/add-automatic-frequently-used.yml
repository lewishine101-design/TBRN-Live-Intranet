name: Add automatic frequently used ranking
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-automatic-frequently-used.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add approved team usage ranking
        shell: bash
        env:
          FEATURE_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = 'id="tbrn-team-frequently-used"'
          if marker in text:
              raise SystemExit("Automatic frequently used feature already exists")
          if text.count("</body>") != 1:
              raise SystemExit("Expected exactly one closing body tag")
          feature = base64.b64decode(os.environ["FEATURE_B64"]).decode("utf-8")
          text = text.replace("</body>", feature + "\n</body>", 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm -f '.github/workflows/add-automatic-frequently-used.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/add-automatic-frequently-used.yml'
          git commit -m 'Automate frequently used resources'
          git push origin main
