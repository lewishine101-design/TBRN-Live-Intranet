name: Finalize Enrique live deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-enrique-finalize.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary deployment trigger
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codex-enrique-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/codex-enrique-finalize.yml
          git commit -m "Remove Enrique deployment trigger"
          git push origin HEAD:main
