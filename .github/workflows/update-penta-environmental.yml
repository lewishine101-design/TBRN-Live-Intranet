name: Update Penta Environmental
on:
  push:
    paths:
      - .github/workflows/update-penta-environmental.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply contractor update
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          changes = {
            "RSK Raw": "Penta Environmental (RSK Raw)",
            "03451668491 / 0127632092": "03451668491 / 03300026044",
            "tbrn@raw-group.com": "newinstructions@pentaenvironmental.co.uk; info@pentaenvironmental.co.uk",
            "Don't cover ROI or NI but can use a subbie over there if needed.": "Emergency contact / instructions to proceed: 0345 166 8491 - newinstructions@pentaenvironmental.co.uk. Non-emergency communications: 0330 002 6044 - info@pentaenvironmental.co.uk.",
            "tbrn-contractor-baseline-repair-20261118-v6-": "tbrn-contractor-baseline-repair-20261119-v7-",
          }
          for old, new in changes.items():
              if old not in text:
                  raise SystemExit(f"Expected source value not found: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-penta-environmental.yml
          git add index.html
          git commit -m "Update RSK Raw to Penta Environmental"
          git push origin main
