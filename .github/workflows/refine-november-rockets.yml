name: Refine November rockets
on:
  push:
    paths:
      - '.github/workflows/refine-november-rockets.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish realistic firework rockets
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > hub-november.css
          printf '%s' '' | base64 --decode > hub-november.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'hub-november.css?v=5': 'hub-november.css?v=7',
              'hub-november.js?v=6': 'hub-november.js?v=7'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected asset reference: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          node --check hub-november.js
          grep -q 'hub-november.css?v=7' index.html
          grep -q 'hub-november.js?v=7' index.html
          rm -f .github/workflows/refine-november-rockets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hub-november.css hub-november.js .github/workflows/refine-november-rockets.yml
          git commit -m "Make November card rockets more realistic"
          git push
