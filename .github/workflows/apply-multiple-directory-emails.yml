name: Support multiple directory emails
on:
  push:
    paths:
      - '.github/workflows/apply-multiple-directory-emails.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply multiple-email support
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/multiple-directory-emails.patch
          git apply /tmp/multiple-directory-emails.patch
          git rm '.github/workflows/apply-multiple-directory-emails.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Support multiple directory emails'
          git push origin main
