name: Deploy contractor phone chooser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-phone-chooser.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested Hub update
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/contractor-phone-chooser.patch
          git apply --check /tmp/contractor-phone-chooser.patch
          git apply /tmp/contractor-phone-chooser.patch
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f '.github/workflows/deploy-phone-chooser.yml'
          git add index.html '.github/workflows/deploy-phone-chooser.yml'
          git commit -m "Add contractor phone number chooser"
          git push origin main
