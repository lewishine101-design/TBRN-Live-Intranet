name: Apply cloud refresh stability fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cloud-refresh-stability.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch unchanged snapshot handling
        run: |
          echo '' | base64 -d > /tmp/tbrn_patch.py
          python /tmp/tbrn_patch.py
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-cloud-refresh-stability.yml
          git commit -m "Prevent unchanged cloud refreshes"
          git push origin main
