name: Apply contractor postcode regions
on:
  push:
    paths:
      - .github/workflows/apply-contractor-postcode-regions.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated update
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/contractor-regions.patch
          git apply --check /tmp/contractor-regions.patch
          git apply /tmp/contractor-regions.patch
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('index.html','utf8');
          let n=0;
          for(const m of h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
            if(m[1].trim()) new vm.Script(m[1],{filename:`inline-${++n}.js`});
          }
          console.log(`${n} scripts valid`);
          NODE
          git diff --check
      - name: Commit update and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-contractor-postcode-regions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-contractor-postcode-regions.yml
          git commit -m "Set contractor regions from base postcodes"
          git push
