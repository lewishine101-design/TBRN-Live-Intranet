name: Publish Halloween ghost peeks

on:
  push:
    paths:
      - ".github/workflows/publish-halloween-ghost-peeks.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live Hub
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Activate the ghost-peek assets
        shell: bash
        run: |
          perl -0pi -e 's/hub-halloween\.css\?v=2/hub-halloween.css?v=3/g; s/hub-halloween\.js\?v=2/hub-halloween.js?v=3/g' index.html
          grep -q 'hub-halloween.css?v=3' index.html
          grep -q 'hub-halloween.js?v=3' index.html

      - name: Publish the Halloween ghost peeks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate Halloween card ghosts"
          git push origin main

      - name: Remove the temporary publishing workflow
        shell: bash
        run: |
          git rm .github/workflows/publish-halloween-ghost-peeks.yml
          git commit -m "Remove Halloween ghost publishing workflow"
          git push origin main
