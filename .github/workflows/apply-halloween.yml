name: Apply Halloween Hub 2.1 theme

on:
  push:
    paths:
      - ".github/workflows/apply-halloween.yml"

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live Hub
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Enable the seasonal assets
        shell: bash
        run: |
          if ! grep -q 'hub-halloween.css?v=1' index.html; then
            perl -0pi -e 's#(<link rel="stylesheet" href="hub-modern\.css\?v=5">\n)#$1<link rel="stylesheet" href="hub-halloween.css?v=1">\n#' index.html
          fi
          if ! grep -q 'hub-halloween.js?v=1' index.html; then
            perl -0pi -e 's#(<script src="hub-modern\.js\?v=5"></script>\n)#$1<script src="hub-halloween.js?v=1"></script>\n#' index.html
          fi
          grep -q 'hub-halloween.css?v=1' index.html
          grep -q 'hub-halloween.js?v=1' index.html

      - name: Publish the Halloween theme
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable Halloween Hub 2.1 theme"
          git push origin main

      - name: Remove the temporary publishing workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-halloween.yml
          git commit -m "Remove Halloween publishing workflow"
          git push origin main
