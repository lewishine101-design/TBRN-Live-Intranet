name: Force contractor region recovery
"on":
  push:
    paths:
      - .github/workflows/force-contractor-region-recovery.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recovery revision
        env:
          PATCH_DATA: 
        run: |
          printf '%s' "$PATCH_DATA" | base64 -d | git apply
          git diff --check
      - name: Commit recovery revision
        run: |
          rm .github/workflows/force-contractor-region-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/force-contractor-region-recovery.yml
          git commit -m "Force shared contractor region recovery"
          git push
