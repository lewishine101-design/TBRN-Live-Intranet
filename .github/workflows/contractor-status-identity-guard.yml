name: Apply contractor status identity guard
on:
  push:
    paths:
      - .github/workflows/contractor-status-identity-guard.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add identity guard
        env:
          GUARD_B64: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = 'id="tbrn-contractor-status-identity-guard"'
          if marker not in text:
              guard = base64.b64decode(__import__("os").environ["GUARD_B64"]).decode("utf-8")
              closing = "</body></html>"
              if closing not in text:
                  raise SystemExit("Hub closing tag not found")
              text = text.replace(closing, guard + "\n" + closing, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Validate scripts
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          const failures=[];
          scripts.forEach((m,i)=>{if(!m[1].trim())return;try{new vm.Script(m[1],{filename:'inline-'+i})}catch(e){failures.push(i+': '+e.message)}});
          if(failures.length)throw new Error(failures.join('\n'));
          if(!html.includes('tbrn-contractor-status-identity-guard'))throw new Error('Identity guard missing');
          NODE
      - name: Commit safeguard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/contractor-status-identity-guard.yml
          git add index.html .github/workflows/contractor-status-identity-guard.yml
          git commit -m "Keep contractor statuses with contractor identities"
          git push
