name: Apply openable executive summary categories
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-openable-executive-summary-categories.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved update
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/executive-summary.patch
          git apply /tmp/executive-summary.patch
          rm -f '.github/workflows/apply-openable-executive-summary-categories.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/apply-openable-executive-summary-categories.yml'
          git commit -m 'Make executive summary categories openable'
          git push origin main
