name: Apply Enrique redesign directly
on:
  push:
    paths:
      - '.github/workflows/apply-enrique-inline.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch the embedded Enrique panel
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch_enrique_inline.py
          python3 /tmp/patch_enrique_inline.py
          grep -q 'width:min(360px,calc(100vw - 28px))' index.html
          grep -q 'TBRN ASSISTANT' index.html
          grep -q 'your TBRN assistant' index.html
          ! grep -q 'enrique-modern.js?v=1' index.html
          rm -f enrique-modern.js
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html enrique-modern.js .github/workflows/apply-enrique-inline.yml
          git rm .github/workflows/apply-enrique-inline.yml
          git commit -m "Apply Enrique redesign inside assistant"
          git push
