name: Refresh notification script cache

on:
  push:
    paths:
      - '.github/workflows/refresh-notification-cache.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump notification asset version and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "hub-notifications.js?v=2"
          new = "hub-notifications.js?v=3"
          if old not in text and new not in text:
              raise SystemExit("Notification script reference not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git rm .github/workflows/refresh-notification-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh notification script cache"
          git push
