name: Publish Halloween ghost position fix

on:
  push:
    paths:
      - ".github/workflows/publish-halloween-ghost-position-fix.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live Hub
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Activate the corrected ghost positions
        shell: bash
        run: |
          perl -0pi -e 's/hub-halloween\.css\?v=4/hub-halloween.css?v=5/g; s/hub-halloween\.js\?v=4/hub-halloween.js?v=5/g' index.html
          grep -q 'hub-halloween.css?v=5' index.html
          grep -q 'hub-halloween.js?v=5' index.html

      - name: Publish the position fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate Halloween ghost position fix"
          git push origin main

      - name: Remove the temporary publishing workflow
        shell: bash
        run: |
          git rm .github/workflows/publish-halloween-ghost-position-fix.yml
          git commit -m "Remove Halloween ghost position workflow"
          git push origin main
