name: Align saving fee percentages
on:
  push:
    paths:
      - '.github/workflows/apply-saving-percentage-alignment.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply percentage alignment
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/saving-percentage-alignment.patch
          git apply /tmp/saving-percentage-alignment.patch
          git rm '.github/workflows/apply-saving-percentage-alignment.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Align saving fee percentages'
          git push origin main
