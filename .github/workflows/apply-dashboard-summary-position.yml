name: Move dashboard summaries
on:
  push:
    paths:
      - '.github/workflows/apply-dashboard-summary-position.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply dashboard reorder
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/dashboard-summary-position.patch
          git apply /tmp/dashboard-summary-position.patch
          git rm '.github/workflows/apply-dashboard-summary-position.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move dashboard summaries to bottom'
          git push origin main
