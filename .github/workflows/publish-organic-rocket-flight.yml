name: Publish organic rocket flight
on:
  push:
    paths:
      - '.github/workflows/publish-organic-rocket-flight.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish curved flight and smoke trail
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > hub-november.css
          printf '%s' '' | base64 --decode > hub-november.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'hub-november.css?v=8': 'hub-november.css?v=9',
              'hub-november.js?v=8': 'hub-november.js?v=9'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected asset reference: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          node --check hub-november.js
          grep -q 'hub-november.css?v=9' index.html
          grep -q 'hub-november.js?v=9' index.html
          rm -f .github/workflows/publish-organic-rocket-flight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hub-november.css hub-november.js .github/workflows/publish-organic-rocket-flight.yml
          git commit -m "Add organic rocket flight and smoke trail"
          git push
