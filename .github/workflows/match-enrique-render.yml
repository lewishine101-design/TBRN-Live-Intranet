name: Match Enrique approved render
on:
  push:
    paths:
      - '.github/workflows/match-enrique-render.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved Enrique proportions and layout
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch_enrique_render_match.py
          python3 /tmp/patch_enrique_render_match.py
          grep -q 'height:min(330px' index.html
          grep -q 'top:-92px' index.html
          grep -q 'Hub assistant · Online' index.html
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/match-enrique-render.yml
          git commit -m "Match Enrique approved compact design"
          git push
