name: Apply final Staff table formatting

on:
  push:
    paths:
      - .github/workflows/apply-kb-final-layer.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add final Staff-mode formatting layer
        shell: bash
        run: |
          python - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = 'id="tbrn-kb-final-staff-format"'
          payload = b64decode("").decode("utf-8")
          if marker not in text:
              if text.count("</body>") != 1:
                  raise SystemExit("Could not locate the closing body tag")
              text = text.replace("</body>", payload + "\n</body>", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflows
        run: |
          rm -f .github/workflows/apply-kb-final-layer.yml
          rm -f .github/workflows/apply-kb-definitive-formatting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows
          git commit -m "Enforce staff table formatting"
          git push
