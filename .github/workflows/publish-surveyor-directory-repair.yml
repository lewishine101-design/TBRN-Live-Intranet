name: Publish surveyor directory repair
on:
  push:
    paths:
      - .github/workflows/publish-surveyor-directory-repair.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply directory repair
        shell: python
        run: |
          from pathlib import Path

          old_parser = """ else{const hi=rows.findIndex(r=>r.includes('Company')&&r.some(v=>v.includes('Surveyor')));let region='';for(const r0 of rows.slice(hi+1)){let r=r0.filter((v,i)=>!(i===0&&!v));while(r.length&&!r[r.length-1])r.pop();if(r.length>=9){region=stripComment(r[0]);r=r.slice(1)}while(r.length<8)r.push('');const company=shortName(r[0]),person=shortName(r[1]);if(!company&&!person)continue;entries.push({id:uid(),kind:'surveyor',name:person||company,company,region,postcode:r[2],phone:r[3],email:r[4],primary:r[5],secondary:r[6],notes:r[7],hold:/not working|on hold|off allocation|cannot drive/i.test(stripComment(r[1])),badges:[]})}}"""
          new_parser = """ else{const hi=rows.findIndex(r=>r.includes('Company')&&r.some(v=>v.includes('Surveyor')));let region='';for(const r0 of rows.slice(hi+1)){const r=[...r0];while(r.length&&!r[r.length-1])r.pop();const emailIndex=r.findIndex(v=>/@/.test(String(v||'')));if(emailIndex<4)continue;const companyIndex=emailIndex-4,personIndex=emailIndex-3,postcodeIndex=emailIndex-2,phoneIndex=emailIndex-1;const rowRegion=r.slice(0,companyIndex).map(stripComment).find(Boolean);if(rowRegion)region=rowRegion;const company=shortName(r[companyIndex]),person=shortName(r[personIndex]);if(!company&&!person)continue;entries.push({id:uid(),kind:'surveyor',name:person||company,company,region,postcode:r[postcodeIndex]||'',phone:r[phoneIndex]||'',email:r[emailIndex]||'',primary:r[emailIndex+1]||'',secondary:r[emailIndex+2]||'',notes:r[emailIndex+3]||'',hold:/not working|on hold|off allocation|cannot drive/i.test(stripComment(r[personIndex])),badges:[]})}}"""
          old_migration = """ const repaired=saved.map(entry=>{
            if(!entry)return entry;
            const postcode=normal(entry.postcode),phone=normal(entry.phone),email=normal(entry.email);"""
          new_migration = """ const repaired=saved.map(entry=>{
            if(!entry)return entry;
            if(x.title==='3. Surveyors'){
             const looksShifted=/@/.test(String(entry.primary||''))&&!/@/.test(String(entry.email||''))||/^[A-Z]{1,2}\\d[A-Z\\d]?\\s*\\d[A-Z]{2}$/i.test(String(entry.phone||'').trim());
             if(looksShifted){
              const identity=[entry.name,entry.company,entry.postcode].map(normal).filter(Boolean);
              const match=seeded.find(candidate=>identity.includes(normal(candidate.name))||identity.includes(normal(candidate.company)));
              if(match){changed=true;return {...entry,name:match.name,company:match.company,region:match.region,postcode:match.postcode,phone:match.phone,email:match.email,primary:match.primary,secondary:match.secondary,notes:match.notes}}
             }
            }
            const postcode=normal(entry.postcode),phone=normal(entry.phone),email=normal(entry.email);"""

          for filename in ('index.html','app.js'):
              path=Path(filename)
              text=path.read_text(encoding='utf-8')
              if old_parser not in text or old_migration not in text:
                  raise SystemExit(f'Expected directory code not found in {filename}')
              text=text.replace(old_parser,new_parser,1).replace(old_migration,new_migration,1)
              path.write_text(text,encoding='utf-8')

          Path('.github/workflows/publish-surveyor-directory-repair.yml').unlink()
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js .github/workflows/publish-surveyor-directory-repair.yml
          git commit -m "Repair shifted surveyor directory fields"
          git push
