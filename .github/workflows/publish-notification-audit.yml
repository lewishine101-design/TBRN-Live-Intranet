name: Publish notification audit report
on:
  push:
    paths:
      - '.github/workflows/publish-notification-audit.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified notification audit update
        shell: bash
        run: |
          echo '' | base64 -d > hub-notifications.js
          sed -i 's/hub-notifications.js?v=6/hub-notifications.js?v=7/g' index.html
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm '.github/workflows/publish-notification-audit.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hub-notifications.js index.html '.github/workflows/publish-notification-audit.yml'
          git commit -m 'Add notification audit report export'
          git push
