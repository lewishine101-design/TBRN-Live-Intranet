name: Refresh Call Summary download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-call-summary-download.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh loader and remove temporary workflow
        run: |
          sed -i 's/hub-call-summary.js?v=2/hub-call-summary.js?v=3/g' index.html
          rm -f .github/workflows/refresh-call-summary-download.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refresh-call-summary-download.yml
          git commit -m "Publish Call Summary pop-out download"
          git push
