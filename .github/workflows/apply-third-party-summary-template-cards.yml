name: Apply third party summary template cards
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-third-party-summary-template-cards.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved update
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/third-party-template-cards.patch
          git apply /tmp/third-party-template-cards.patch
          rm -f '.github/workflows/apply-third-party-summary-template-cards.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/apply-third-party-summary-template-cards.yml'
          git commit -m 'Add third party executive summary template cards'
          git push origin main
