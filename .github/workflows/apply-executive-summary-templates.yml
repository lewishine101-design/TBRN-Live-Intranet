name: Add Executive Summary Templates
on:
  push:
    paths:
      - '.github/workflows/apply-executive-summary-templates.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply resource
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/executive-summary-templates.patch
          git apply /tmp/executive-summary-templates.patch
          git rm '.github/workflows/apply-executive-summary-templates.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Executive Summary Templates resource'
          git push origin main
