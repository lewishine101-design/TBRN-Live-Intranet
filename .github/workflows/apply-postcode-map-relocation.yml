name: Relocate Postcode Map
on:
  push:
    paths:
      - '.github/workflows/apply-postcode-map-relocation.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply map relocation
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/postcode-map-relocation.patch
          git apply /tmp/postcode-map-relocation.patch
          git rm '.github/workflows/apply-postcode-map-relocation.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Relocate Postcode Map resources'
          git push origin main
