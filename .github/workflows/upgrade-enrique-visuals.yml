name: Upgrade Enrique mascot and panel
on:
  push:
    paths:
      - '.github/workflows/upgrade-enrique-visuals.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install upgraded Enrique
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch_enrique_visual_upgrade.py
          printf '%s' '' | base64 --decode > enrique-mascot.png
          python3 /tmp/patch_enrique_visual_upgrade.py
          grep -q 'width:min(400px' index.html
          grep -q 'height:min(480px' index.html
          grep -q 'enrique-mascot.png' index.html
          file enrique-mascot.png | grep -q 'PNG image data'
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html enrique-mascot.png
          git rm .github/workflows/upgrade-enrique-visuals.yml
          git commit -m "Upgrade Enrique mascot and chat proportions"
          git push
