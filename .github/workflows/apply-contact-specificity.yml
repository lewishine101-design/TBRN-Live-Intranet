name: Fix first contact row
on:
  push:
    paths:
      - '.github/workflows/apply-contact-specificity.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply contact override
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/contact-specificity.patch
          git apply /tmp/contact-specificity.patch
          git rm '.github/workflows/apply-contact-specificity.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Override bold first contact row'
          git push origin main
