name: Publish Enrique dataset expansion
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-enrique-dataset-v2.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex-enrique-dataset-20261006
          git show origin/codex-enrique-dataset-20261006:.codex/enrique-dataset-v2.patch.gz.b64 | base64 -d | gzip -d > /tmp/enrique-dataset.patch
          git apply --check /tmp/enrique-dataset.patch
          git apply /tmp/enrique-dataset.patch
          git diff --check
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const knowledge=JSON.parse(fs.readFileSync('tbrn-knowledge.json','utf8'));
          if(knowledge.schemaVersion!==2||knowledge.version!=='2026-10-06.2')throw new Error('Knowledge version validation failed');
          const profiles=knowledge.items.filter(item=>item.profile);
          if(profiles.length!==112)throw new Error('Expected 112 directory profiles, found '+profiles.length);
          const index=fs.readFileSync('index.html','utf8');
          for(const marker of ['TBRN_ENRIQUE_DIRECTORY_SNAPSHOT','directoryProfileResult','tbrn-enrique-knowledge-v2','What postcodes does Smartroof cover?']){
            if(!index.includes(marker))throw new Error('Missing '+marker);
          }
          let count=0;
          for(const match of index.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)){
            count++;
            if(match[1].trim())new vm.Script(match[1]);
          }
          if(count<50)throw new Error('Outer script extraction failed');
          NODE
          rm .github/workflows/codex-enrique-dataset-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tbrn-knowledge.json .github/workflows/codex-enrique-dataset-v2.yml
          git commit -m "Expand Enrique contractor knowledge"
          git push origin HEAD:main
          git push origin --delete codex-enrique-dataset-20261006 || true
