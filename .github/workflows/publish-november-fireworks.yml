name: Publish November live fireworks
on:
  push:
    paths:
      - '.github/workflows/publish-november-fireworks.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install fireworks assets
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > hub-november.css
          printf '%s' '' | base64 --decode > hub-november.js
          rm -f .github/workflows/publish-november-fireworks.yml
      - name: Verify and publish
        shell: bash
        run: |
          node --check hub-november.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub-november.css hub-november.js .github/workflows/publish-november-fireworks.yml
          git commit -m "Add live November fireworks"
          git push
