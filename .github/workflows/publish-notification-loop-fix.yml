name: Publish notification loop fix

on:
  push:
    paths:
      - '.github/workflows/publish-notification-loop-fix.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish fixed runtime and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "hub-notifications.js?v=4"
          new = "hub-notifications.js?v=5"
          if old not in text and new not in text:
              raise SystemExit("Hub runtime script reference not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git rm .github/workflows/publish-notification-loop-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish notification stability fix"
          git push
