name: Combine directory email actions
on:
  push:
    paths:
      - '.github/workflows/apply-combined-directory-email.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply combined email action
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/combined-directory-email.patch
          git apply /tmp/combined-directory-email.patch
          git rm '.github/workflows/apply-combined-directory-email.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Combine directory email actions'
          git push origin main
