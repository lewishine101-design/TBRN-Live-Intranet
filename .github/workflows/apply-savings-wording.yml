name: Apply savings calculator wording
on:
  push:
    paths:
      - '.github/workflows/apply-savings-wording.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply wording
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/savings-wording.patch
          git apply /tmp/savings-wording.patch
          git rm '.github/workflows/apply-savings-wording.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update savings calculator introduction'
          git push origin main
