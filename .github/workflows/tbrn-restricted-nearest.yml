name: Publish restricted nearest search

on:
  push:
    paths:
      - '.github/workflows/tbrn-restricted-nearest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 'codex/restricted-nearest-20261005:refs/remotes/origin/codex/restricted-nearest-20261005'
          git show 'origin/codex/restricted-nearest-20261005:.codex/restricted-nearest.patch.gz.b64' | base64 --decode | gzip --decompress > /tmp/restricted-nearest.patch
          echo 'd57ed2551a165e693543d5c351832704a0093de38dbf0863721b023519fa2e3c  /tmp/restricted-nearest.patch' | sha256sum --check
          git apply --check /tmp/restricted-nearest.patch
          git apply /tmp/restricted-nearest.patch
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('index.html','utf8');
          const start=source.indexOf('async function findNearest()');
          const end=source.indexOf('function initialiseDirectMap()',start);
          const block=source.slice(start,end);
          const required=[
            ".sort((a,b)=>pRank[a.prio]-pRank[b.prio]||a.straight-b.straight).slice(0,12)",
            "routed.sort((a,b)=>pRank[a.prio]-pRank[b.prio]||a.miles-b.miles)",
            'Available with limited services',
            'Available for TP claims only'
          ];
          for(const text of required){
            if(!block.includes(text))throw new Error('Missing nearest-search rule: '+text);
          }
          if(block.includes('statusRank')||block.includes('if(routed.length>=3)break')){
            throw new Error('Restricted contractors are still being penalised');
          }
          const pattern=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let match,count=0;
          while((match=pattern.exec(source))){
            if(/\bsrc\s*=/.test(match[1])||/type=["'](?:application\/json|importmap)/i.test(match[1]))continue;
            new vm.Script(match[2],{filename:'embedded-'+(++count)+'.js'});
          }
          console.log('Validated '+count+' embedded scripts.');
          NODE
          rm '.github/workflows/tbrn-restricted-nearest.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/tbrn-restricted-nearest.yml'
          git commit -m 'Publish restricted nearest search'
          git push origin HEAD:main
          git push origin --delete 'codex/restricted-nearest-20261005' || true
