name: Apply multiline notes repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-multiline-notes-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve note line breaks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          style_marker = '.entry-note{\n  white-space:pre-wrap;\n}'
          if style_marker not in html:
              anchor = '''.on-hold-notes-box b{
            display:block;
            margin-bottom:4px;
            font-size:10px;
            text-transform:uppercase;
            letter-spacing:.05em;
          }
          </style>'''
              replacement = '''.on-hold-notes-box b{
            display:block;
            margin-bottom:4px;
            font-size:10px;
            text-transform:uppercase;
            letter-spacing:.05em;
          }
          .entry-note{
            white-space:pre-wrap;
          }
          .on-hold-notes-box span{
            display:block;
            white-space:pre-wrap;
          }
          </style>'''
              if anchor not in html:
                  raise SystemExit('Notes style anchor not found')
              html = html.replace(anchor, replacement, 1)
          old = "notes.innerHTML='<b>On Hold Notes</b>'+esc(entry.onHoldNotes);"
          new = "notes.innerHTML='<b>On Hold Notes</b><span>'+esc(entry.onHoldNotes)+'</span>';"
          if old in html:
              html = html.replace(old, new, 1)
          elif new not in html:
              raise SystemExit('On-hold note renderer not found')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Validate repaired file
        run: |
          grep -q 'white-space:pre-wrap' index.html
          grep -q "<b>On Hold Notes</b><span>" index.html
          git diff --check
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/apply-multiline-notes-fix.yml
          git config user.name 'TBRN Live Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/apply-multiline-notes-fix.yml
          git commit -m 'Preserve multiline contractor notes'
          git push origin main
