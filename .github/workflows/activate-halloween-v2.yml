name: Activate illustrated Halloween theme

on:
  push:
    paths:
      - ".github/workflows/activate-halloween-v2.yml"

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live Hub
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Activate the illustrated seasonal assets
        shell: bash
        run: |
          perl -0pi -e 's/hub-halloween\.css\?v=1/hub-halloween.css?v=2/g; s/hub-halloween\.js\?v=1/hub-halloween.js?v=2/g' index.html
          grep -q 'hub-halloween.css?v=2' index.html
          grep -q 'hub-halloween.js?v=2' index.html

      - name: Publish the corrected Halloween theme
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate illustrated Halloween Hub theme"
          git push origin main

      - name: Remove the temporary publishing workflow
        shell: bash
        run: |
          git rm .github/workflows/activate-halloween-v2.yml
          git commit -m "Remove Halloween v2 publishing workflow"
          git push origin main
