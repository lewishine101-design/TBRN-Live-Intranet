name: Apply contractor change log
on:
  push:
    paths:
      - .github/workflows/apply-contractor-change-log.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and validate change log
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/change-log.patch
          git apply --check /tmp/change-log.patch
          git apply /tmp/change-log.patch
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(match=>match[1]).filter(source=>source.trim());
          scripts.forEach((source,index)=>new vm.Script(source,{filename:'inline-'+(index+1)+'.js'}));
          console.log(scripts.length+' inline scripts valid');
          NODE
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-contractor-change-log.yml
          git add index.html
          git commit -m "Add contractor change log"
          git push origin main
