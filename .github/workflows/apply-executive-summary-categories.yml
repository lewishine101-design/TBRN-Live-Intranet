name: Add executive summary categories
on:
  push:
    paths:
      - '.github/workflows/apply-executive-summary-categories.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply template categories
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/executive-summary-categories.patch
          git apply /tmp/executive-summary-categories.patch
          git rm '.github/workflows/apply-executive-summary-categories.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add executive summary template categories'
          git push origin main
