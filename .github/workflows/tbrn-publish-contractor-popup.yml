name: Publish contractor popup update
on:
  push:
    paths:
      - '.github/workflows/tbrn-publish-contractor-popup.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply prepared update
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/tbrn-update.patch
          git apply --index /tmp/tbrn-update.patch
          git rm '.github/workflows/tbrn-publish-contractor-popup.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add full contractor cards to map pins'
          git push origin main
