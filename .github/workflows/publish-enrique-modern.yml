name: Publish Enrique redesign
on:
  push:
    paths:
      - '.github/workflows/publish-enrique-modern.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add modern Enrique presentation
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > enrique-modern.js
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tag='<script src=\"enrique-modern.js?v=1\"></script>'; closing='</body></html>'; assert closing in s or tag in s; s=s if tag in s else s.replace(closing, tag+'\\n\\n'+closing, 1); p.write_text(s,encoding='utf-8')"
          node --check enrique-modern.js
          grep -q 'enrique-modern.js?v=1' index.html
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html enrique-modern.js
          git rm .github/workflows/publish-enrique-modern.yml
          git commit -m "Modernise Enrique assistant"
          git push
