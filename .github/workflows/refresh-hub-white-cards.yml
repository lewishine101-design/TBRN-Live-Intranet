name: Refresh Hub white-card assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-hub-white-cards.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load white-card Hub theme
        shell: bash
        run: |
          perl -0pi -e 's/hub-modern\.css(?:\?v=\d+)?/hub-modern.css?v=5/g' index.html
          perl -0pi -e 's/hub-modern\.js(?:\?v=\d+)?/hub-modern.js?v=5/g' index.html
          rm -f .github/workflows/refresh-hub-white-cards.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/refresh-hub-white-cards.yml
          git commit -m 'Load Hub v5 white-card assets'
          git push origin main
