name: Publish red neon card hover
on:
  push:
    paths:
      - '.github/workflows/publish-red-neon-hover.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add red neon card styling
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > hub-red-neon.css
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='<title>TBRN Live</title>'; tag='<link rel=\"stylesheet\" href=\"hub-red-neon.css?v=1\">'; assert marker in s or tag in s; s=s if tag in s else s.replace(marker, marker+'\\n'+tag, 1); p.write_text(s,encoding='utf-8')"
          grep -q 'hub-red-neon.css?v=1' index.html
          grep -q 'border-color: #ff3855' hub-red-neon.css
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hub-red-neon.css
          git rm .github/workflows/publish-red-neon-hover.yml
          git commit -m "Add red neon card hover"
          git push
