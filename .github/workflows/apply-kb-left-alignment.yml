name: Apply Knowledge Base left alignment

on:
  push:
    paths:
      - .github/workflows/apply-kb-left-alignment.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Left-align Knowledge Base cells
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "  vertical-align:top;\n  font-size:11px;\n  line-height:1.5;\n  white-space:pre-wrap!important;\n}\n.kb-table tr:nth-child(even) td"
          new = "  vertical-align:top;\n  text-align:left!important;\n  font-size:11px;\n  line-height:1.5;\n  white-space:pre-wrap!important;\n}\n.kb-table tr:nth-child(even) td"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one Knowledge Base alignment target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/apply-kb-left-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-kb-left-alignment.yml
          git commit -m "Left align staff table content"
          git push
