name: Publish Enrique card mischief

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-publish-enrique-mischief.yml

permissions:
  contents: write

concurrency:
  group: codex-publish-enrique-mischief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and verify update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/enrique-mischief-20261006
          git show origin/codex/enrique-mischief-20261006:.codex/enrique-mischief.patch.gz.b64 | base64 -d | gunzip > /tmp/enrique-mischief.patch
          echo "5f32f04d3b7bf2fc0005fc39812c037bde88a0b9d463e8ebbe78563093a101bd  /tmp/enrique-mischief.patch" | sha256sum -c -
          git apply --check /tmp/enrique-mischief.patch
          git apply /tmp/enrique-mischief.patch
          grep -q 'function visiblePlaythings()' index.html
          grep -q '@keyframes enriqueCardPoke' index.html
          grep -q 'pointer-events:none' index.html
          grep -q 'prefers-reduced-motion:reduce' index.html
          rm .github/workflows/codex-publish-enrique-mischief.yml

      - name: Validate embedded scripts
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          for(const [i,m] of [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(m[1].trim())new vm.Script(m[1],{filename:'outer-'+i+'.js'});
          }
          const marker='frame.srcdoc=';
          const start=html.indexOf(marker)+marker.length;
          const end=html.indexOf(';\n  let assistantOpen',start);
          if(start<marker.length||end<0)throw new Error('Enrique srcdoc not found');
          const srcdoc=vm.runInNewContext(html.slice(start,end));
          for(const [i,m] of [...srcdoc.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
            if(m[1].trim())new vm.Script(m[1],{filename:'inner-'+i+'.js'});
          }
          if(!html.includes('pokeCard(first,8200)')||!html.includes('pokeCard(second||first,12600)'))throw new Error('Card interactions missing');
          if(!html.includes('.enrique-poked{animation:none!important}'))throw new Error('Reduced motion safeguard missing');
          NODE

      - name: Commit live update and clean temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/codex-publish-enrique-mischief.yml
          git commit -m "Make Enrique climb and poke Hub cards"
          git push origin main
          git push origin --delete codex/enrique-mischief-20261006 || true
