name: Separate seasonal achievements
on:
  push:
    paths:
      - '.github/workflows/separate-seasonal-achievements.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Ghost Hunter and add Rocket Wrangler
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > hub-november.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'hub-november.js?v=5': 'hub-november.js?v=6',
              "{id:'ghost-hunter',icon:'🚀',title:'Rocket Wrangler',desc:'Catch a November firework rocket while it is peeking.'}": "{id:'ghost-hunter',icon:'👻',title:'Ghost Hunter',desc:'Catch a Halloween ghost while it is peeking.'},\n    {id:'rocket-wrangler',icon:'🚀',title:'Rocket Wrangler',desc:'Catch a November firework rocket while it is peeking.'}",
              "'ghost-hunter':'Two mischievous rockets are playing hide-and-seek behind the dashboard cards. Catch one before it launches.'": "'ghost-hunter':'Something pale keeps peeking from behind the dashboard cards. Catch it before it disappears.',\n    'rocket-wrangler':'Two mischievous rockets are playing hide-and-seek behind the dashboard cards. Catch one before it launches.'"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old[:70]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          node --check hub-november.js
          grep -q "id:'ghost-hunter'.*Ghost Hunter" index.html
          grep -q "id:'rocket-wrangler'.*Rocket Wrangler" index.html
          grep -q 'hub-november.js?v=6' index.html
          rm -f .github/workflows/separate-seasonal-achievements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hub-november.js .github/workflows/separate-seasonal-achievements.yml
          git commit -m "Separate Ghost Hunter and Rocket Wrangler achievements"
          git push
