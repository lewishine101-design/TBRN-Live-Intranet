name: Apply audited Hub repair
on:
  push:
    paths:
      - .github/workflows/apply-audited-hub-repair.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and validate repair
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/hub-repair.patch
          git apply --check /tmp/hub-repair.patch
          git apply /tmp/hub-repair.patch
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('index.html','utf8');
          const scripts=[...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach((s,i)=>new vm.Script(s,{filename:'inline-'+(i+1)+'.js'}));
          console.log(scripts.length+' inline scripts valid');
          NODE
          git diff --check
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-audited-hub-repair.yml
          git add index.html
          git commit -m "Repair directory recovery and map eligibility"
          git push origin main
