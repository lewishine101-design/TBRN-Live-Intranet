name: Publish Hub notification centre

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-hub-notifications.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add notification assets to Hub
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="hub-notifications.css?v=1">'
          script = '<script src="hub-notifications.js?v=1"></script>'
          if css not in source:
              marker = '<link rel="stylesheet" href="hub-red-neon.css?v=1">'
              if marker not in source:
                  raise SystemExit("Stylesheet marker not found")
              source = source.replace(marker, marker + "\n" + css, 1)
          if script not in source:
              marker = '<script src="hub-modern.js?v=5"></script>'
              if marker not in source:
                  raise SystemExit("Script marker not found")
              source = source.replace(marker, marker + "\n" + script, 1)
          path.write_text(source, encoding="utf-8")
          Path(".github/workflows/publish-hub-notifications.yml").unlink()
      - name: Commit live update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate Hub update notification centre"
          git push origin main
