name: Correct Penta contact number
on:
  push:
    paths:
      - .github/workflows/correct-penta-number.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final contact correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          if "0127632092" not in text:
              raise SystemExit("Legacy number not found")
          text = text.replace("0127632092", "03300026044")
          text = text.replace("tbrn-contractor-baseline-repair-20261119-v7-", "tbrn-contractor-baseline-repair-20261119-v8-")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/correct-penta-number.yml
          git add index.html
          git commit -m "Correct Penta secondary contact number"
          git push origin main
