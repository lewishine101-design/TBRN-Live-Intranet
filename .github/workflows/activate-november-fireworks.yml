name: Activate November fireworks assets
on:
  push:
    paths:
      - '.github/workflows/activate-november-fireworks.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate versioned seasonal assets
        shell: bash
        run: |
          sed -i 's/hub-november\.css?v=3/hub-november.css?v=4/g; s/hub-november\.js?v=3/hub-november.js?v=4/g' index.html
          grep -q 'hub-november.css?v=4' index.html
          grep -q 'hub-november.js?v=4' index.html
          rm -f .github/workflows/activate-november-fireworks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/activate-november-fireworks.yml
          git commit -m "Activate live November fireworks"
          git push
