name: Mount contractor log in Admin
on:
  push:
    paths:
      - .github/workflows/mount-contractor-log.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Admin mounting fix
        run: |
          echo '' | base64 -d > /tmp/mount.patch
          git apply --check /tmp/mount.patch
          git apply /tmp/mount.patch
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');const html=fs.readFileSync('index.html','utf8');[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()).forEach((s,i)=>new vm.Script(s,{filename:'inline-'+(i+1)+'.js'}));
          NODE
          git diff --check
      - name: Commit and clean up
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/mount-contractor-log.yml
          git add index.html
          git commit -m "Mount contractor log in Admin dashboard"
          git push origin main
