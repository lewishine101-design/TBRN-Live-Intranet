name: Refresh Call Summary loader
on:
  push:
    paths:
      - '.github/workflows/refresh-call-summary-loader.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader cache version
        run: sed -i 's/hub-call-summary.js?v=1/hub-call-summary.js?v=2/g' index.html
      - name: Commit and clean up
        run: |
          rm '.github/workflows/refresh-call-summary-loader.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/refresh-call-summary-loader.yml'
          git commit -m 'Refresh Call Summary loader cache'
          git push
