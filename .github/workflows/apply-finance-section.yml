name: Add Finance section
on:
  push:
    paths:
      - '.github/workflows/apply-finance-section.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Finance section
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/finance-section.patch
          git apply /tmp/finance-section.patch
          git rm '.github/workflows/apply-finance-section.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Split Finance and VAT sections'
          git push origin main
