name: Restore contractor directory fields
"on":
  push:
    paths:
      - .github/workflows/restore-contractor-directory.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate recovery
        env:
          CONTRACTOR_PATCH: 
        run: |
          printf '%s' "$CONTRACTOR_PATCH" | base64 -d | git apply
          node -e "const fs=require('fs'),vm=require('vm');const h=fs.readFileSync('index.html','utf8');let n=0;for(const m of h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(!m[1].trim())continue;new vm.Script(m[1]);n++}console.log(n+' scripts valid')"
          git diff --check
      - name: Commit live recovery
        run: |
          rm .github/workflows/restore-contractor-directory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-contractor-directory.yml
          git commit -m "Restore contractor directory baseline fields"
          git push
