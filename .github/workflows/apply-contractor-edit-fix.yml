name: Apply contractor edit repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-contractor-edit-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair contractor edit controls
        shell: bash
        env:
          FIX_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'id="tbrn-contractor-edit-fix"'
          if marker not in html:
              fix = base64.b64decode(os.environ['FIX_B64']).decode('utf-8')
              anchor = '<script id="tbrn-admin-persistence-fix">'
              if anchor not in html:
                  raise SystemExit('Persistence script anchor not found')
              html = html.replace(anchor, fix + '\n' + anchor, 1)
              path.write_text(html, encoding='utf-8')
          PY
      - name: Validate repaired file
        run: |
          grep -q 'id="tbrn-contractor-edit-fix"' index.html
          grep -q '__activeManagedDirectoryTitle=title' index.html
          git diff --check
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/apply-contractor-edit-fix.yml
          git config user.name 'TBRN Live Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/apply-contractor-edit-fix.yml
          git commit -m 'Fix contractor edit controls'
          git push origin main
