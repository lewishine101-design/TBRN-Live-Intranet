name: Force Hub asset refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-hub-asset-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force current Hub assets
        shell: bash
        run: |
          perl -0pi -e 's/hub-modern\.css(?:\?v=\d+)?/hub-modern.css?v=3/g' index.html
          perl -0pi -e 's/hub-modern\.js(?:\?v=\d+)?/hub-modern.js?v=3/g' index.html
          rm -f .github/workflows/force-hub-asset-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/force-hub-asset-refresh.yml
          git commit -m 'Force Hub v3 contrast assets'
          git push origin main
