name: Apply Hub cache refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hub-cache-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh Hub asset versions
        shell: bash
        run: |
          sed -i 's/hub-modern\.css?v=2/hub-modern.css?v=3/g' index.html
          sed -i 's/hub-modern\.js?v=2/hub-modern.js?v=3/g' index.html
          rm -f .github/workflows/apply-hub-cache-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-hub-cache-refresh.yml
          git commit -m 'Refresh Hub 2.1 theme assets'
          git push origin main
