name: Add contractor client filters
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-contractor-client-filters.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add approved LBG INS TP filters
        shell: bash
        env:
          STYLE_B64: 
          SCRIPT_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          if 'id="tbrn-contractor-client-filter-styles"' in text:
              raise SystemExit("Contractor client filters already exist")

          start_marker = '<script id="tbrn-map-integration-script">'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("Contractor map script was not found")
          end = text.find('</script>', start)
          if end < 0:
              raise SystemExit("Contractor map script closing tag was not found")
          end += len('</script>')

          styles = base64.b64decode(os.environ["STYLE_B64"]).decode("utf-8")
          script = base64.b64decode(os.environ["SCRIPT_B64"]).decode("utf-8")
          text = text[:start] + styles + script.rstrip() + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          rm -f '.github/workflows/add-contractor-client-filters.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/add-contractor-client-filters.yml'
          git commit -m 'Add contractor client type filters'
          git push origin main
