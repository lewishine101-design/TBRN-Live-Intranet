name: Publish Enrique click-through fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-enrique-clickfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out live hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and publish validated fix
        shell: bash
        env:
          UPLOAD_BRANCH: codex/enrique-clickfix-upload-20261003
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "+refs/heads/${UPLOAD_BRANCH}:refs/remotes/origin/${UPLOAD_BRANCH}"
          git ls-tree -r --name-only "origin/${UPLOAD_BRANCH}" -- .codex-upload/enrique-clickfix |
            sort |
            while IFS= read -r path; do git show "origin/${UPLOAD_BRANCH}:${path}"; done |
            base64 --decode > /tmp/enrique-clickfix.patch

          echo "2769184becc023de9b16766ea7baf7220d40dedfd331892de9b54b0cb56171b4  /tmp/enrique-clickfix.patch" | sha256sum -c -
          git apply --check /tmp/enrique-clickfix.patch
          git apply /tmp/enrique-clickfix.patch

          grep -q "#enriqueAssistantFrame.enrique-collapsed{width:180px;height:86px}" index.html
          grep -q "frame.className='enrique-collapsed'" index.html
          grep -q "function setAssistantState(open)" index.html
          grep -q "frame.classList.toggle('enrique-collapsed',event.data.state==='closed')" index.html
          grep -q ">Sing to me</button>" index.html
          grep -q "function heroResult(query)" index.html
          git diff --check

          git add index.html
          git rm .github/workflows/publish-enrique-clickfix.yml
          git commit -m "Fix Enrique overlay click blocking"
          git push origin HEAD:main
          git push origin --delete "${UPLOAD_BRANCH}"
