name: Move escalation contacts
on:
  push:
    paths:
      - '.github/workflows/apply-escalation-category.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply category move
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/escalation-category.patch
          git apply /tmp/escalation-category.patch
          git rm '.github/workflows/apply-escalation-category.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move escalation contacts to Contacts'
          git push origin main
