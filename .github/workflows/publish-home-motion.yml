name: Publish homepage motion controls
"on":
  push:
    paths:
      - .github/workflows/publish-home-motion.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate
        run: |
          python3 .github/deploy-home-motion.py
          node --check hub-november.js
          git diff --check
      - name: Commit live update
        run: |
          rm .github/deploy-home-motion.py
          rm .github/workflows/publish-home-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hub-november.js .github/deploy-home-motion.py .github/workflows/publish-home-motion.yml
          git commit -m "Restrict animated characters to home dashboard"
          git push
