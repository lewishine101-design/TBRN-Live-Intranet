name: Publish Enrique singing response

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-enrique-song.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out live hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and publish validated update
        shell: bash
        env:
          UPLOAD_BRANCH: codex/enrique-song-upload-20261002
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "+refs/heads/${UPLOAD_BRANCH}:refs/remotes/origin/${UPLOAD_BRANCH}"
          mkdir -p /tmp/enrique-release

          git ls-tree -r --name-only "origin/${UPLOAD_BRANCH}" -- .codex-upload/enrique/mp3 |
            sort |
            while IFS= read -r path; do git show "origin/${UPLOAD_BRANCH}:${path}"; done |
            base64 --decode > /tmp/enrique-release/tbrn.mp3

          git ls-tree -r --name-only "origin/${UPLOAD_BRANCH}" -- .codex-upload/enrique/patch |
            sort |
            while IFS= read -r path; do git show "origin/${UPLOAD_BRANCH}:${path}"; done |
            base64 --decode > /tmp/enrique-release/enrique-song.patch

          test "$(stat -c%s /tmp/enrique-release/tbrn.mp3)" = "5335712"
          echo "6826434fa69da3509b39a96f1527670eb27b91311dbf8196c2d91bce53778d4e  /tmp/enrique-release/tbrn.mp3" | sha256sum -c -

          git apply --check /tmp/enrique-release/enrique-song.patch
          git apply /tmp/enrique-release/enrique-song.patch
          cp /tmp/enrique-release/tbrn.mp3 tbrn.mp3

          grep -q "function songResult" index.html
          grep -q "tbrn.mp3" index.html
          grep -q "frame.allow='autoplay'" index.html
          git diff --check

          git add index.html tbrn.mp3
          git rm .github/workflows/publish-enrique-song.yml
          git commit -m "Add Enrique singing response"
          git push origin HEAD:main
          git push origin --delete "${UPLOAD_BRANCH}"
