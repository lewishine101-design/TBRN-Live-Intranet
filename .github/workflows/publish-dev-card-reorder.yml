name: Publish Dev Mode card reordering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dev-card-reorder.yml'

permissions:
  contents: write

concurrency:
  group: publish-dev-card-reorder
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated update
        env:
          TBRN_PATCH_B64: ''
        run: |
          printf '%s' "$TBRN_PATCH_B64" | base64 --decode > /tmp/tbrn-dev-card-reorder.patch
          git apply --check /tmp/tbrn-dev-card-reorder.patch
          git apply /tmp/tbrn-dev-card-reorder.patch
          git diff --check
          rm '.github/workflows/publish-dev-card-reorder.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/publish-dev-card-reorder.yml'
          git commit -m 'Add Dev Mode card reordering'
          git push origin HEAD:main
