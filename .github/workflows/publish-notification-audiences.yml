name: Publish notification audience controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-notification-audiences.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Activate audience controls
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          source = source.replace('hub-notifications.css?v=1', 'hub-notifications.css?v=2', 1)
          source = source.replace('hub-notifications.js?v=1', 'hub-notifications.js?v=2', 1)
          if 'hub-notifications.css?v=2' not in source or 'hub-notifications.js?v=2' not in source:
              raise SystemExit("Notification references were not updated")
          path.write_text(source, encoding="utf-8")
          Path(".github/workflows/publish-notification-audiences.yml").unlink()
      - name: Commit live update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate notification audience controls"
          git push origin main
