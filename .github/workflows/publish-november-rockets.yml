name: Publish November card rockets
on:
  push:
    paths:
      - '.github/workflows/publish-november-rockets.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install November rocket experience
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > hub-november.css
          printf '%s' '' | base64 --decode > hub-november.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'hub-november.css?v=4': 'hub-november.css?v=5',
              'hub-november.js?v=4': 'hub-november.js?v=5',
              "{id:'ghost-hunter',icon:'👻',title:'Ghost Hunter',desc:'Catch a Halloween ghost while it is peeking.'}": "{id:'ghost-hunter',icon:'🚀',title:'Rocket Wrangler',desc:'Catch a November firework rocket while it is peeking.'}",
              "'ghost-hunter':'Something pale keeps peeking from behind the dashboard cards. Catch it before it disappears.'": "'ghost-hunter':'Two mischievous rockets are playing hide-and-seek behind the dashboard cards. Catch one before it launches.'"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old[:60]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          node --check hub-november.js
          grep -q 'hub-november.js?v=5' index.html
          grep -q 'Rocket Wrangler' index.html
          rm -f .github/workflows/publish-november-rockets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hub-november.css hub-november.js .github/workflows/publish-november-rockets.yml
          git commit -m "Replace Halloween ghosts with November rockets"
          git push
