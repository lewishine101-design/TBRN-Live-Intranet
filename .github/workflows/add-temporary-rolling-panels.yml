name: Add temporary rolling panels
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-temporary-rolling-panels.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add approved temporary rolling panel manager
        shell: bash
        env:
          BOOTSTRAP_B64: 
          ADMIN_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          if 'id="tbrn-temporary-rolling-panels-bootstrap"' in text or 'id="tbrn-temporary-rolling-panels-admin"' in text:
              raise SystemExit("Temporary rolling panel feature already exists")

          bootstrap = base64.b64decode(os.environ["BOOTSTRAP_B64"]).decode("utf-8")
          admin = base64.b64decode(os.environ["ADMIN_B64"]).decode("utf-8")
          rolling_marker = '<script id="tbrn-rolling-dashboard-script">'
          refresh_marker = '<script id="tbrn-refresh-view-persistence">'

          if text.count(rolling_marker) != 1:
              raise SystemExit("Expected one rolling dashboard marker")
          if text.count(refresh_marker) != 1:
              raise SystemExit("Expected one refresh persistence marker")

          text = text.replace(rolling_marker, bootstrap + rolling_marker, 1)
          text = text.replace(refresh_marker, admin + refresh_marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm -f '.github/workflows/add-temporary-rolling-panels.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '.github/workflows/add-temporary-rolling-panels.yml'
          git commit -m 'Add temporary rolling display panels'
          git push origin main
